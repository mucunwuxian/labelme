auto_save: false
display_label_popup: true
store_data: true
keep_prev: false
keep_prev_scale: false
keep_prev_brightness_contrast: false
logger_level: info

flags: null
label_flags: null
labels: null
file_search: null
sort_labels: true
validate_label: null

default_shape_color: [0, 255, 0]
shape_color: auto  # null, 'auto', 'manual'
shift_auto_shape_color: 0
label_colors: null

shape:
  # drawing
  line_color: [0, 255, 0, 128]
  fill_color: [0, 0, 0, 64]
  vertex_fill_color: [0, 255, 0, 255]
  # selecting / hovering
  select_line_color: [255, 255, 255, 255]
  select_fill_color: [0, 255, 0, 64]
  hvertex_fill_color: [255, 255, 255, 100]
  point_size: 8

ai:
  default: 'Sam2 (balanced)'

# main
flag_dock:
  show: true
  closable: true
  movable: true
  floatable: true
label_dock:
  show: true
  closable: true
  movable: true
  floatable: true
shape_dock:
  show: true
  closable: true
  movable: true
  floatable: true
file_dock:
  show: true
  closable: true
  movable: true
  floatable: true

# label_dialog
show_label_text_field: true
label_completion: startswith
fit_to_content:
  column: true
  row: false

# canvas
epsilon: 10.0
canvas:
  fill_drawing: true
  # None: do nothing
  # close: close polygon
  double_click: close
  # The max number of edits we can undo
  num_backups: 10
  # show crosshair
  # auto-fit re-detection tolerance (image pixels)
  auto_fit_tolerance: 0.2
  # show crosshair
  crosshair:
    polygon: false
    rectangle: true
    circle: false
    line: false
    point: false
    linestrip: false
    ai_polygon: false
    ai_mask: false

# Parallel line magnet: rectangle edge snaps to parallel lines in the image.
# Only active for rectangle edge midpoint drag with matching target_label.
# Shift key cancels snap during drag.
# Example:
#   parallel_line_magnet:
#     - target_label: "notes"
#       resize_base: 2560           # letterbox resize reference (longer side)
#       margin_pixels: 10           # margin at resize_base scale
#       snap_range_pixels: 5        # ±5px lock zone (at resize_base scale)
#       luminance_threshold: 128    # luminance diff from base to detect line
#       sample_points: 11
#       consecutive_window: 8
#       distance_tolerance: 0.5
parallel_line_magnet: []

# Text bounding magnet: rectangle edge snaps to text boundaries.
# Only active for rectangle edge midpoint drag with matching target_label.
# Shift key cancels snap during drag.
# Example:
#   text_bounding_magnet:
#     - target_label: "title"
#       resize_base: 2560           # letterbox resize reference (longer side)
#       margin_pixels: 0.5          # offset from boundary (at resize_base scale)
#       snap_range_pixels: 3        # ±3px lock zone (at resize_base scale)
#       luminance_threshold: 30
#       min_agreement: 6
text_bounding_magnet: []

# Line fit magnet: rectangle edge snaps directly onto detected line peaks.
# Scans both perpendicular directions to find the darkest point (luminance peak).
# Only active for rectangle edge midpoint drag with matching target_label.
# Shift key cancels snap during drag.
# Example:
#   line_fit_magnet:
#     - target_label: "notes"
#       resize_base: 2560           # letterbox resize reference (longer side)
#       snap_range_pixels: 5        # ±snap zone (at resize_base scale)
#       luminance_threshold: 128    # luminance diff from base to detect line
line_fit_magnet: []

# Dark pixel magnet: cursor snaps to dark pixels during vertex drag / shape drawing.
# Only active for shapes with matching target_label.
# Shift key cancels snap during drag.
# Example:
#   dark_pixel_magnet:
#     - target_label: "notes"
#       resize_base: 2560           # snap_range_pixels reference scale (longer side)
#       snap_range_pixels: 20       # search square side length (at resize_base scale)
#       luminance_threshold: 128    # snap to pixels at or below this luminance
dark_pixel_magnet: []

shortcuts:
  close: Ctrl+W
  open: Ctrl+O
  open_dir: Ctrl+U
  quit: Ctrl+Q
  save: Ctrl+S
  save_as: Ctrl+Shift+S
  save_to: null
  delete_file: Ctrl+Delete

  open_next: [D, Ctrl+Shift+D, Ctrl+Right]
  open_prev: [A, Ctrl+Shift+A, Ctrl+Left]

  zoom_in: [Ctrl++, Ctrl+=]
  zoom_out: Ctrl+-
  zoom_to_original: Ctrl+0
  fit_window: Ctrl+F
  fit_width: Ctrl+Shift+F

  create_polygon: Ctrl+N
  create_rectangle: Ctrl+R
  create_circle: null
  create_line: null
  create_point: null
  create_linestrip: null
  edit_polygon: Ctrl+J
  delete_polygon: Delete
  duplicate_polygon: Ctrl+D
  copy_polygon: Ctrl+C
  paste_polygon: Ctrl+V
  undo: Ctrl+Z
  undo_last_point: Ctrl+Z
  add_point_to_edge: Ctrl+Shift+P
  edit_label: Ctrl+E
  toggle_keep_prev_mode: Ctrl+P
  remove_selected_point: [Meta+H, Backspace]

  show_all_polygons: null
  hide_all_polygons: null
  toggle_all_polygons: T
